source_id: "index_0020"
name: "Sirena Rail & Transport Passenger Itinerary"
pipeline_type: "DATAFORM_DAG"
description: "Complex passenger transport itinerary with station codes, train routes, coach tiers, departure/arrival timestamps, and multi-hop legs"
sla:
  update_frequency: "STATIC"
  min_expected_rows: 50
dataform:
  models:
    staging: "stg_index_0020_movements"
    silver: "silver_movements_index_0020"
  tags:
    - "index_0020"
  assertions:
    - "uniqueKey: [source_id, source_entity_id]"
    - "nonNull: [passenger_name, departure_date, port_from, port_to]"
    - "rowCondition: arrival_date >= departure_date"
target_entities:
  - "silver.movements"
