sourceId: "index_0683"

bronze:
  read:
    path: "regionbilet_base(1).csv"
    options:
      sep: ";"
      mode: "PERMISSIVE"
    trimValues: true
  entities:
    persons:
      columns:
        order_id: "Номер заказа"
        name: "ФИО"
    phones:
      columns:
        phone: "Телефон"
    movements:
      columns:
        order_date: "Дата покупки"
        ticket_type: "Тип билета"
        route: "Маршрут"
        ticket_number: "Номер билета"
        seat: "Место"
silver:
