      - "обл , г , ул ,"
      - "г , г , ул ,"
      - "край , г , ул ,"
      - "обл , с , ул ,"
      - "Респ , г , ул ,"
      - "обл , п , ул ,"
      - "г , г , пр-кт ,"
      - "обл , д , ул ,"
      - "обл , г , пр-кт ,"
      - "обл , рп , ул ,"
      - "[]"
    replaceRegexWithNone: "^(\\s|\\.|\\-|\")*$"
