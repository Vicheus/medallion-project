      - "НЕТ"
      - "нету"
      - "Нету"
      - "НЕТУ"
      - "Не знаю"
      - "не знаю"
      - "Не ввел"
      - "Не пользуюсь"
      - "Не имею"
      - "тест"
      - "Тест"
      - "ТЕСТ"
      - ", , ул., д."
