                pattern:
                  lit: "[0-9]"
              - fn: "regexp_replace"
                column: "firstname"
                pattern:
                  lit: "[0-9]"
              - fn: "regexp_replace"
                column: "middlename"
                pattern:
                  lit: "[0-9]"
          filter: true
        birth_date:
