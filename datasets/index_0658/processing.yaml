bronze:
  read:
    path: "boostra.ru (1.4m, february 2024).csv"
    trimValues: true
    replaceRegexPatrial:
      "user_info_firstname": "^'|'$"
      "user_info_lastname": "^'|'$"
      "user_info_patronymic": "^'|'$"
    replaceWithNone:
