                    column:
                      fn: "concat"
                      columns:
                        - fn: "upper"
                          column:
                            fn: "substring"
                            column: "relation_1"
                            pos:
                              lit: 1
                            len:
                              lit: 1
                        - fn: "substring"
                          column: "relation_1"
                          pos:
                            lit: 2
                          len:
                            fn: "length"
                            column: "relation_1"
                    pattern:
