            fn: "birth_date_udf"
            column: "birth_date"
            date_format:
              lit: "%d.%m.%Y"
        sex:
          source:
            fn: "sex_udf"
            column: "sex"
        birth_place:
          source:
            fn: "coalesce"
            columns:
              - fn: "address_udf"
                column: "birth_place_1"
              - fn: "address_udf"
                column: "birth_place_2"
        relationship:
          source:
            fn: "relationship_udf"
            column: "relationship"
        children:
          source:
            fn: "when"
            cases:
              - condition:
                  fn: "isin"
                  column: "children"
                  values:
                    - lit: "Один"
                    - lit: "Два"
                    - lit: "Три"
                    - lit: "Больше трех"
                value:
                  fn: "children_udf"
                  column:
                    lit: "есть"
              - condition:
                  fn: "eq"
                  column: "children"
                  value:
                    lit: "Нет детей"
                value:
                  fn: "children_udf"
                  column:
                    lit: "нету"
    relations:
