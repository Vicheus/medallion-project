            filter: true
gold:
  ids:
    - id: "people"
      transformations:
        op: "nullifyDocsByTypes"
        ids: "claim_id"
        notInTypes: "5"
    - id: "buyer"
      transformations:
        - op: "filter"
          function:
            fn: "and"
            columns:
              - fn: "isNotNull"
                column: "documents"
              - fn: "gt"
                column:
                  fn: "size"
                  column: "documents"
                value:
                  lit: 0
        - op: "withColumn"
          column: "__buyer"
          function:
            fn: "base_raw_validation_udf"
            column:
              lit: "True"
        - op: "nullifyColByOccurrence"
          column: "claim_id"
          occurrenceColumn: "claim_id"
  transformations:
    - op: "relations"
      ids: "claim_id"
      columns:
        - fn: "try_element_at"
          column: "names"
          value:
            lit: 1
        - "birth_date"
        - fn: "getField"
          column:
            fn: "try_element_at"
            column: "documents"
            value:
              lit: 1
          value:
            lit: "serial"
        - fn: "when"
          cases:
            condition:
              fn: "isNotNull"
              column: "__buyer"
            value:
              lit: "Оформивший заказ"
          otherwise:
            lit: "Привязаны к одному заказу"
    - op: "dropColumns"
      columns: "__buyer"
    - op: "withColumn"
      column: "relations"
      function:
        fn: "expr"
        value:
          lit: "CASE
            WHEN exists(relations, x -> x LIKE '%Оформивший заказ') THEN
                array_sort(array_union(
                    filter(relations, x -> x LIKE '%Оформивший заказ'),
                    slice(filter(relations, x -> NOT x LIKE '%Оформивший заказ'), 1, 19)
                ))
            ELSE
                slice(relations, 1, 20)
        END"
    - op: "groupBy"
      columns:
        - "names"
        - "birth_date"
        - "documents"
        - "sex"
        - "relations"
        - "claim_id"
      positive:
        fn: "isNotNull"
        column: "documents"
    - op: "dropColumns"
      columns: "claim_id"
    - op: "aggGroupBy"
      columns:
        - "source_entity_id"
        - "actuality"
  remain: [ "documents" ]
