silver:
  - id: "people"
    entities:
      common:
        columns:
          claim_id:
            source:
              fn: "case"
              condition:
                fn: "rlike"
                column: "claim_id"
                value:
                  lit: "^\\d+$"
              value: "claim_id"
      persons:
        columns:
          names:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "array"
                  columns:
                    - fn: "name_udf"
                      column: "name_1"
                    - fn: "name_udf"
                      column: "name_2"
                    - fn: "name_udf"
                      column: "name_3"
            filter: true
          birth_date:
            source:
              fn: "birth_date_udf"
              column: "birth_date"
          sex:
            source:
              fn: "sex_udf"
              column: "sex"
      phones:
        columns:
          __phone:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "split"
                  column: "phones"
                  pattern:
                    lit: ","
          phones:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "array"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "__phone"
                        value:
                          lit: "^7 *7|\\b^7 *7"
                      value:
                        fn: "phone_udf"
                        column: "__phone"
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "mobile"
                        value:
                          lit: "^7 *7|\\b^7 *7"
                      value:
                        fn: "phone_udf"
                        column: "mobile"
            filter: true
      emails:
        columns:
          emails:
            source:
              fn: "email_udf"
              column: "email"
            filter: true
      documents:
        columns:
          __serial:
            source:
              fn: "lower"
              column:
                fn: "concat_ws"
                columns:
                  - "serial"
                  - "serial_num"
                sep:
                  lit: ""
            filter:
              fn: "rlike"
              column: "__serial"
              value:
                lit: "n|kaz"
          documents:
            source:
              fn: "document_udf"
              type:
                lit: "паспорт гражданина рк"
              serial:
                fn: "when"
                cases:
                  condition:
                    fn: "rlike"
                    column: "__serial"
                    value:
                      lit: "kaz"
                  value:
                    fn: "when"
                    cases:
                      condition:
                        fn: "rlike"
                        column: "__serial"
                        value:
                          lit: "n"
                      value:
                        fn: "regexp_replace"
                        column: "__serial"
                        pattern:
                          lit: "kaz"
                    otherwise:
                      fn: "regexp_replace"
                      column: "__serial"
                      pattern:
                        lit: "kaz"
                      replacement:
                        lit: "n"
                otherwise: "__serial"
              authority:
                fn: "case"
                condition:
                  fn: "ne"
                  column: "authority"
                  value:
                    lit: "уточним позже"
                value: "authority"
              date_issue: "date_issue"
              date_expire: "date_expire"
            filter: true
      raw_metadata:
        columns:
          raw_metadata:
            source:
              fn: "raw_metadata_udf"
              values:
                order_status: "order_status"
                tour_confirmeddate:
                  fn: "case"
                  condition:
                    fn: "rlike"
                    column: "tour_confirmeddate"
                    value:
                      lit: "^\\d{4}-\\d{2}-\\d{2}$"
                  value: "tour_confirmeddate"
                tour_canceldate:
                  fn: "case"
                  condition:
                    fn: "rlike"
                    column: "tour_canceldate"
                    value:
                      lit: "^\\d{4}-\\d{2}-\\d{2}$"
                  value: "tour_canceldate"
                tour_databeg:
                  fn: "coalesce"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "tour_databeg"
                        value:
                          lit: "^\\d{4}-\\d{2}-\\d{2}$"
                      value: "tour_databeg"
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "claim_tour_databeg"
                        value:
                          lit: "^\\d{4}-\\d{2}-\\d{2}$"
                      value: "claim_tour_databeg"
                tour_dataend:
                  fn: "coalesce"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "tour_dataend"
                        value:
                          lit: "^\\d{4}-\\d{2}-\\d{2}$"
                      value: "tour_dataend"
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "claim_tour_dataend"
                        value:
                          lit: "^\\d{4}-\\d{2}-\\d{2}$"
                      value: "claim_tour_dataend"
                partner: "partner"
                tour: "tour"
                tour_hotel: "tour_hotel"
                tour_room: "tour_room"
                tour_town: "tour_town"
                tour_state: "tour_state"
            filter: true
