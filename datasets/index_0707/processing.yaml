silver:
  - id: "1"
    entities:
      persons:
        columns:
          names:
            source:
              fn: "name_udf"
              column: "name"
            filter: true
          birth_date:
            source:
              fn: "coalesce"
              columns:
                - fn: "birth_date_udf"
                  column: "birth_date"
                  date_format:
                    lit: "%m/%d/%Y"
                - fn: "birth_date_udf"
                  column: "birth_date"
                  date_format:
                    lit: "%d.%m.%Y"
      phones:
        columns:
          phones:
            source:
              fn: "phone_udf"
              column: "phone"
            filter: true
      educations:
        columns:
          __education:
            source:
              fn: "regexp_extract"
              column: "education"
              pattern:
                lit: "^(.*?)\\s+в\\s+(\\d{4})\\s+г.*$"
              index:
                lit: 1
            filter: true
          __date_end:
            source:
              fn: "regexp_extract"
              column: "education"
              pattern:
                lit: "^(.*?)\\s+в\\s+(\\d{4})\\s+г.*$"
              index:
                lit: 2
          __educations:
            source:
              fn: "education_udf"
              level:
                fn: "when"
                cases:
                  condition:
                    fn: "ne"
                    column: "__education"
                    value:
                      lit: ""
                  value:
                    fn: "when"
                    cases:
                      - condition:
                          fn: "isin"
                          column: "__education"
                          values:
                            - lit: "основное общеее"
                            - lit: "сновное общее"
                        value:
                          lit: "средняя школа"
                      - condition:
                          fn: "isin"
                          column: "__education"
                          values:
                            - lit: "средней общее"
                            - lit: "средее общее"
                        value:
                          lit: "среднее общее"
                      - condition:
                          fn: "eq"
                          column: "__education"
                          value:
                            lit: "среднее профессинальное"
                        value:
                          lit: "среднее общее"
                    otherwise: "__education"
                otherwise: "education"
              date_end: "__date_end"
              date_format:
                lit: "%Y"
          educations:
            source:
              fn: "when"
              cases:
                condition:
                  fn: "isNull"
                  column: "__educations"
                value:
                  fn: "education_udf"
                  title: "__education"
                  date_end: "__date_end"
                  date_format:
                    lit: "%Y"
              otherwise: "__educations"
      forces:
        columns:
          forces:
            source:
              fn: "force_udf"
              tag_number: "tag_number"
              rank: "rank"
              unit_name:
                fn: "array_join"
                column:
                  fn: "array_distinct"
                  column:
                    fn: "array"
                    columns:
                      - "unit_name_part_1"
                      - "unit_name_part_2"
                      - "unit_name_part_3"
                      - "unit_name_part_4"
                      - "unit_name_part_5"
              mos_code: "mos_code"
              position:
                fn: "coalesce"
                columns:
                  - "position1"
                  - "position2"
              date_start: "date_start"
              date_format:
                lit: "%m/%d/%Y"
            filter: true
      raw_metadata:
        columns:
          raw_metadata:
            source:
              fn: "raw_metadata_udf"
              values:
                Состоял на военном учете:
                  fn: "coalesce"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "startswith"
                        column:
                          fn: "lower"
                          column: "mil_comst1"
                        value:
                          lit: "вк"
                      value: "mil_comst1"
                    - fn: "case"
                      condition:
                        fn: "startswith"
                        column: "mil_comst2"
                        value:
                          lit: "ВК "
                      value: "mil_comst2"
                в ВС РФ (периоды): "mil_services"
            filter: true
  - id: "2"
    entities:
      persons:
        columns:
          names:
            source:
              fn: "explode"
              column:
                fn: "array"
                columns:
                  - fn: "name_udf"
                    column:
                      fn: "regexp_replace"
                      column: "name1"
                      pattern:
                        lit: "только\\s+зачисление"
                  - fn: "name_udf"
                    column: "name2"
            filter: true
          birth_date:
            source:
              fn: "coalesce"
              columns:
                - fn: "birth_date_udf"
                  column: "birth_date1"
                  date_format:
                    lit: "%m/%d/%Y"
                - fn: "birth_date_udf"
                  column: "birth_date1"
                  date_format:
                    lit: "%d.%m.%Y"
                - fn: "birth_date_udf"
                  column: "birth_date2"
                  date_format:
                    lit: "%m/%d/%Y"
      educations:
        entities: "common"
        columns:
          __defined_education:
            source:
              fn: "coalesce"
              columns:
                - fn: "case"
                  condition:
                    fn: "isin"
                    column:
                      fn: "substring"
                      column: "education"
                      len:
                        lit: 3
                    values:
                      - lit: "осн"
                      - lit: "сре"
                      - lit: "выс"
                  value: "education"
                - fn: "case"
                  condition:
                    fn: "isin"
                    column:
                      fn: "substring"
                      column: "mil_services1"
                      len:
                        lit: 3
                    values:
                      - lit: "осн"
                      - lit: "сре"
                      - lit: "выс"
                  value: "mil_services1"
            filter: true
          __education:
            source:
              fn: "regexp_extract"
              column: "__defined_education"
              pattern:
                lit: "^(.*?)\\s+в\\s+(\\d{4})\\s+г.*$"
              index:
                lit: 1
          __date_end:
            source:
              fn: "regexp_extract"
              column: "__defined_education"
              pattern:
                lit: "^(.*?)\\s+в\\s+(\\d{4})\\s+г.*$"
              index:
                lit: 2
          __educations:
            source:
              fn: "education_udf"
              level: "__education"
              date_end: "__date_end"
              date_format:
                lit: "%Y"
          educations:
            source:
              fn: "when"
              cases:
                condition:
                  fn: "isNull"
                  column: "__educations"
                value:
                  fn: "education_udf"
                  title: "__education"
                  date_end: "__date_end"
                  date_format:
                    lit: "%Y"
              otherwise: "__educations"
      forces:
        columns:
          forces:
            source:
              fn: "force_udf"
              tag_number: "tag_number"
              rank: "rank"
              unit_name:
                fn: "array_join"
                column:
                  fn: "array_distinct"
                  column:
                    fn: "array"
                    columns:
                      - "unit_name_part_1"
                      - "unit_name_part_2"
                      - "unit_name_part_3"
                      - "unit_name_part_4"
                      - "unit_name_part_5"
              mos_code: "mos_code"
              position:
                fn: "coalesce"
                columns:
                  - "position1"
                  - "position2"
              date_start: "date_start"
              date_format:
                lit: "%m/%d/%Y"
            filter: true
      raw_metadata:
        entities: "common"
        columns:
          raw_metadata:
            source:
              fn: "raw_metadata_udf"
              values:
                Состоял на военном учете:
                  fn: "coalesce"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "startswith"
                        column: "mil_comst1"
                        value:
                          lit: "ВК "
                      value: "mil_comst1"
                    - fn: "case"
                      condition:
                        fn: "startswith"
                        column: "mil_comst2"
                        value:
                          lit: "ВК "
                      value: "mil_comst2"
                в ВС РФ (периоды):
                  fn: "coalesce"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "mil_services1"
                        value:
                          lit: "^(с |23)"
                      value: "mil_services1"
                    - fn: "case"
                      condition:
                        fn: "rlike"
                        column: "mil_services2"
                        value:
                          lit: "^(с |23)"
                      value: "mil_services2"
            filter: true
  - id: "3"
    entities:
      persons:
        columns:
          names:
            source:
              fn: "name_udf"
              column: "name"
            filter: true
          birth_date:
            source:
              fn: "birth_date_udf"
              column: "birth_date"
