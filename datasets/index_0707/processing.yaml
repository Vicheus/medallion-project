              pattern:
                lit: "^(.*?)\\s+в\\s+(\\d{4})\\s+г.*$"
              index:
                lit: 1
            filter: true
          __date_end:
            source:
              fn: "regexp_extract"
              column: "education"
              pattern:
                lit: "^(.*?)\\s+в\\s+(\\d{4})\\s+г.*$"
              index:
                lit: 2
          __educations:
            source:
              fn: "education_udf"
              level:
                fn: "when"
                cases:
                  condition:
                    fn: "ne"
                    column: "__education"
                    value:
                      lit: ""
                  value: "__education"
                otherwise: "education"
              date_end: "__date_end"
              date_format:
                lit: "%Y"
          educations:
            source:
              fn: "when"
              cases:
                condition:
                  fn: "isNull"
                  column: "__educations"
                value:
                  fn: "education_udf"
                  title: "__education"
                  date_end: "__date_end"
                  date_format:
                    lit: "%Y"
              otherwise: "__educations"
      forces:
        columns:
          forces:
            source:
              fn: "force_udf"
              tag_number: "tag_number"
              rank: "rank"
              unit_name:
                fn: "array_join"
                column:
                  fn: "array_distinct"
                  column:
                    fn: "array"
                    columns:
                      - "unit_name_part_1"
                      - "unit_name_part_2"
                      - "unit_name_part_3"
                      - "unit_name_part_4"
                      - "unit_name_part_5"
              position: "position"
              date_start: "date_start"
              date_format:
                lit: "%m/%d/%Y"
            filter: true
      raw_metadata:
        columns:
          raw_metadata:
            source:
              fn: "raw_metadata_udf"
              values:
                Состоял на военном учете: "mil_comst"
                в ВС РФ (периоды): "mil_services"
            filter: true
  - id: "4"
    entities:
      persons:
        columns:
          names:
            source:
              fn: "name_udf"
              column: "name"
            filter: true
      forces:
        columns:
          forces:
            source:
              fn: "force_udf"
              tag_number: "tag_number"
              rank: "rank"
              unit_name:
                fn: "regexp_replace"
                column: "unit_name"
                pattern:
                  lit: "^[Зз]а "
            filter: true
