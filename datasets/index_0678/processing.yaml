          works:
            source:
              fn: "work_udf"
              post:
                fn: "case"
                condition:
                  fn: "rlike"
                  column: "post"
                  value:
                    lit: "[а-яёА-ЯЁ]"
                value: "post"
              company: "company_name"
              date_start:
                fn: "work_date_udf"
                column: "date_start"
                date_format:
                  lit: "%Y-%m-%d"
              date_end:
                fn: "work_date_udf"
                column: "date_end"
                date_format:
                  lit: "%Y-%m-%d"
              company_address: "address"
              company_ru_inn: "inn"
              company_ru_ogrn: "ogrn"
              comment:
                fn: "trim"
                column:
                  fn: "concat_ws"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "isNotNull"
                        column: "primary_okved_code"
                      value:
                        fn: "concat"
                        columns:
                          - "primary_okved_code"
                          - fn: "case"
                            condition:
                              fn: "isNotNull"
                              column: "primary_okved_name"
                            value:
                              lit: ":"
                    - fn: "case"
                      condition:
                        fn: "isNotNull"
                        column: "primary_okved_name"
                      value:
                        fn: "concat"
                        columns:
                          - "primary_okved_name"
                          - lit: ". "
                    - fn: "case"
                      condition:
                        fn: "isNotNull"
                        column: "__categories"
                      value:
                        fn: "concat_ws"
                        columns:
                          - "__categories"
                          - fn: "case"
                            condition:
                              fn: "isNotNull"
                              column: "__subcategories"
                            value:
                              lit: "; "
                        sep:
                          lit: ""
                    - fn: "case"
                      condition:
                        fn: "isNotNull"
                        column: "__subcategories"
                      value: "__subcategories"
                  sep:
                    lit: ""
            filter: true
      raw_metadata:
        entities:
          - "raw_metadata"
          - "works"
        columns:
          raw_metadata:
            source:
              fn: "raw_metadata_udf"
              values:
                "data_occupations":
                  fn: "case"
                  condition:
                    fn: "not"
                    column:
                      fn: "rlike"
                      column: "post"
                      value:
