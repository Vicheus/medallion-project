                  condition:
                    fn: "rlike"
                    column: "passport_serial"
                    value:
                      lit: "\\d"
                  value:
                    fn: "split"
                    column: "passport_serial"
                    pattern:
                      lit: "[,;]"
          __exploded_inn_serial:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "case"
                  condition:
                    fn: "rlike"
                    column: "inn_serial"
                    value:
                      lit: "\\d"
                  value:
                    fn: "split"
                    column: "inn_serial"
                    pattern:
                      lit: "[,;]"
          __inn_serial:
            source:
              fn: "when"
              cases:
                condition:
                  fn: "rlike"
                  column: "name"
                  value:
                    lit: "\\d{2}\\.\\d{2}\\.\\d{4}"
                value:
                  fn: "case"
                  condition:
                    fn: "rlike"
                    column: "patronymic_inn"
                    value:
                      lit: "\\d{11,12}"
                  value: "patronymic_inn"
              otherwise:
                fn: "case"
                condition:
                  fn: "rlike"
                  column: "__exploded_inn_serial"
                  value:
                    lit: "\\d{11,12}"
                value: "__exploded_inn_serial"
          __snils_serial:
            source:
              fn: "case"
              condition:
                fn: "rlike"
                column: "snils_serial"
                value:
                  lit: "\\d"
              value: "snils_serial"
          __driver_license_serial:
            source:
              fn: "case"
              condition:
                fn: "rlike"
                column: "driver_license"
                value:
                  lit: "^\\d{10} \\d{2}\\.\\d{2}\\.\\d{4}$"
              value:
                fn: "regexp_extract"
                column: "driver_license"
                pattern:
                  lit: "^(\\d{10}) "
                index:
                  lit: 1
          __driver_license_date_issue:
            source:
              fn: "case"
              condition:
                fn: "rlike"
                column: "driver_license"
                value:
                  lit: "^\\d{10} \\d{2}\\.\\d{2}\\.\\d{4}$"
              value:
                fn: "regexp_extract"
                column: "driver_license"
                pattern:
                  lit: " (\\d{2}\\.\\d{2}\\.\\d{4})$"
                index:
                  lit: 1
          documents:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "array"
                  columns:
                    - fn: "document_udf"
                      type:
