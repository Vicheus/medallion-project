                company_address_longitude: "company_longitude"
                company_regDate: "company_reg_date"
                company_regionCode: "company_region_code"
            filter: true
      actuality:
        entities: "works"
        columns:
          actuality:
            source:
              fn: "latest_actuality_date_udf"
              columns:
                - "date_start"
                - "date_end"
              date_format:
                lit: "%Y-%m-%d"
            filter: true
gold:
  ids:
    - id: "executives"
    - id: "employees"
  transformations:
    - op: "withColumn"
      column: "phones"
      function:
        fn: "slice"
        column: "phones"
        start:
          lit: 1
        len:
          lit: 15
    - op: "withColumn"
      column: "emails"
      function:
        fn: "slice"
        column: "emails"
        start:
          lit: 1
        len:
          lit: 15
    - op: "withColumn"
      column: "documents"
      function:
        fn: "slice"
        column: "documents"
        start:
          lit: 1
        len:
          lit: 10
    - op: "withColumn"
      column: "vehicles"
      function:
        fn: "slice"
        column: "vehicles"
        start:
          lit: 1
        len:
          lit: 20
  remain: [ "works", "documents", "phones", "emails" ]
