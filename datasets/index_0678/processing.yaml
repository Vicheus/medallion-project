              fn: "actuality_date_udf"
              column: "record_date"
              date_format:
                lit: "%Y-%m-%d"
            filter: true
  - id: "employees"
    entities:
      persons:
        entities:
          - "persons"
          - "documents"
        columns:
          names:
            source:
              fn: "when"
              cases:
                condition:
                  fn: "rlike"
                  column: "name"
                  value:
                    lit: "\\d{2}\\.\\d{2}\\.\\d{4}"
                value: "snils_serial"
              otherwise:
                fn: "name_udf"
                column: "name"
            filter: true
          birth_date:
            source:
              fn: "when"
              cases:
                condition:
                  fn: "rlike"
                  column: "name"
                  value:
                    lit: "\\d{2}\\.\\d{2}\\.\\d{4}"
                value:
                  fn: "birth_date_udf"
                  column: "birth_date"
                  date_format:
                    lit: "%d.%m.%Y"
              otherwise:
                fn: "birth_date_udf"
                column: "birth_date"
          birth_place:
            source:
              fn: "case"
              condition:
                fn: "and"
                columns:
                  - fn: "isNotNull"
                    column: "birth_place"
                  - fn: "not"
                    column:
                      fn: "rlike"
                      column: "name"
                      value:
                        lit: "\\d{2}\\.\\d{2}\\.\\d{4}"
                  - fn: "not"
                    column:
                      fn: "rlike"
                      column: "birth_place"
                      value:
                        lit: "\\b([Кк][Вв]|[Кк]вартира|[Уу][Лл]|[Уу]лица|delivery|reg|fact|[Дд][Оо][Мм]|[Дд])\\b"
              value:
                fn: "address_udf"
                column: "birth_place"
      phones:
        columns:
          phones:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "case"
                  condition:
                    fn: "rlike"
                    column: "phones"
                    value:
                      lit: "\\d"
                  value:
                    fn: "phones_udf"
                    column:
                      fn: "split"
                      column: "phones"
                      pattern:
                        lit: "[,;]"
            filter: true
      emails:
        columns:
          emails:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "case"
                  condition:
                    fn: "rlike"
                    column: "emails"
                    value:
                      lit: "@"
                  value:
                    fn: "emails_udf"
                    column:
                      fn: "split"
                      column: "emails"
                      pattern:
                        lit: "[,;]"
            filter: true
      documents:
        entities:
