sourceId: "index_0678"

bronze:
  - id: "executives"
    read:
      path: "company_executives.csv"
      trimValues: true
      replaceRegexPatrial:
        "data.recordDate": "T00:00:00\\.000Z$"
        "data.pii.birthday": "T00:00:00\\.000Z$"
      append:
        - read:
            path: "companies.csv"
            trimValues: true
            replaceRegexPatrial:
              "raw_data.regDate": "T00:00:00\\.000Z$"
            aliases:
              id: "company_id"
          ids: [ "company_id" ]
          type: "left"
        - read:
            path: "company_founders.csv"
            trimValues: true
          ids: [ "person_id", "full_name" ]
          type: "left"
    entities:
      persons:
        columns:
          name: "full_name"
          birth_date: "data.pii.birthday"
      emails:
        columns:
          email: "data.pii.email"
      phones:
        columns:
          phone: "data.pii.phones"
      documents:
        columns:
          passport_serial: "data.pii.passportNumbers"
          inn_serial: "data.person.innPerson"
          snils_serial: "data.pii.snils"
      works:
        columns:
          post: "role_title"
          post_en: "data.mappedPosition.englishTitle"
          company_name: "raw_data.nameFull"
          company_short_name: "raw_data.nameShort"
          address: "raw_data.address.rawAddress"
          categories: "raw_data.category.categories"
          subcategories: "raw_data.category.subcategories"
          inn: "raw_data.inn"
          ogrn: "raw_data.ogrn"
          primary_okved_code: "raw_data.primaryOkved.okvedCode.code"
          primary_okved_name: "raw_data.primaryOkved.okvedCode.name"
      address:
        columns:
          address: "data.pii.addresses"
      raw_metadata:
        columns:
          share_percent: "share_percent"
          share_nominal: "share_nominal"
          company_latitude: "raw_data.address.latitude"
          company_longitude: "raw_data.address.longitude"
          company_reg_date: "raw_data.regDate"
          company_region_code: "raw_data.regionCode"
      actuality:
        columns:
          record_date: "data.recordDate"
  - id: "employees"
    read:
      path: "employees.csv"
      trimValues: true
      replaceRegexPatrial:
        "data.dateFrom": "T00:00:00\\.000Z$"
        "data.dateTo": "T00:00:00\\.000Z$"
        "data.birthday": "T00:00:00\\.000Z$"
      aliases:
        "data.personId": "person_id"
      append:
        read:
          path: "companies.csv"
          trimValues: true
          replaceRegexPatrial:
            "raw_data.regDate": "T00:00:00\\.000Z$"
          aliases:
            id: "company_id"
        ids: [ "company_id" ]
        type: "left"
    entities:
      persons:
        columns:
          name: "data.name"
          birth_date: "data.birthday"
          birth_place: "data.birthplaces"
      emails:
        columns:
          emails: "data.email"
      phones:
        columns:
          phones: "data.phones"
      documents:
        columns:
          passport_serial: "data.passportNumbers"
          inn_serial: "data.inn"
          patronymic_inn: "data.patronymic"
          snils_serial: "data.snils"
          driver_license: "data.driverLicense"
      works:
        columns:
          post: "data.occupations"
          company_name: "raw_data.nameFull"
          company_short_name: "raw_data.nameShort"
          address: "raw_data.address.rawAddress"
          categories: "raw_data.category.categories"
          subcategories: "raw_data.category.subcategories"
          inn: "raw_data.inn"
          ogrn: "raw_data.ogrn"
          date_start: "data.dateFrom"
          date_end: "data.dateTo"
          primary_okved_code: "raw_data.primaryOkved.okvedCode.code"
          primary_okved_name: "raw_data.primaryOkved.okvedCode.name"
      vehicles:
        columns:
          numbers: "data.carPlate"
      address:
        columns:
          address: "data.addresses"
      raw_metadata:
        columns:
          company_latitude: "raw_data.address.latitude"
          company_longitude: "raw_data.address.longitude"
          company_reg_date: "raw_data.regDate"
          company_region_code: "raw_data.regionCode"
silver:
  - id: "executives"
    entities:
      persons:
        columns:
          names:
            source:
              fn: "name_udf"
              column: "name"
            filter: true
          birth_date:
            source:
              fn: "birth_date_udf"
              column: "birth_date"
      phones:
        columns:
          phones:
            source:
              fn: "phone_udf"
              column: "phone"
            filter: true
      emails:
        columns:
          emails:
            source:
              fn: "email_udf"
              column: "email"
            filter: true
      documents:
        columns:
          documents:
            source:
              fn: "explode"
              column:
                fn: "array"
                columns:
                  - fn: "document_udf"
                    type:
                      lit: "паспорт гражданина рф"
                    serial: "passport_serial"
                  - fn: "document_udf"
                    type:
                      lit: "инн"
                    serial: "inn_serial"
                  - fn: "document_udf"
                    type:
                      lit: "снилс"
                    serial: "snils_serial"
            filter: true
      address:
        columns:
          address:
            source:
              fn: "address_udf"
              column: "address"
            filter: true
      works:
        columns:
          __categories:
