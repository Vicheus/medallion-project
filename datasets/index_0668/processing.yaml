silver:
  entities:
    persons:
      columns:
        names:
          source:
            fn: "name_parts_ordered_udf"
            columns:
              - "lastname"
              - "firstname"
              - "middlename"
          filter: true
        birth_date:
          source:
            fn: "birth_date_udf"
            column: "birth_date"
            date_format:
              lit: "%d.%m.%Y"
    phones:
      columns:
        phones:
          source:
              fn: "phone_udf"
              column: "phone"
    address:
      columns:
        address:
          source:
            fn: "address_udf"
            column: "address"
    ips:
      columns:
        ips:
          source:
            fn: "ip_udf"
            ip: "ip_address"
          filter: true
gold:
  remain: ["phones"]
  transformations:
    op: "groupBy"
    columns:
        - "names"
        - "phones"
    positive: 
        fn: isNotNull
        column: "phones"
  