bronze:
  - id: "admins"
    read:
      path: "admins.csv"
      trimValues: " \"'/_-"
      replaceWithNone: "нет"
      replaceRegexWithNone: "^(\\s|\\-|\\*|;|,|\\.|=|/|\\+|\")*$"
    entities:
      persons:
        columns:
          name: "nik"
      emails:
        columns:
          email: "email"
      accounts:
        columns:
          login: "login"
          password: "password"
      raw_metadata:
        columns:
          departments: "departments"
      actuality:
        columns:
          actuality: "date_lastrequest"
  - id: "managers"
    read:
      path: "managers.csv"
      trimValues: " \"'/_-"
      replaceWithNone: "нет"
      replaceRegexWithNone: "^(\\s|\\-|\\*|;|,|\\.|=|/|\\+|\")*$"
      append:
        read:
          path: "suppliers.csv"
          options:
            multiline: "true"
          trimValues: " \"'/_-"
          replaceRegexPatrial:
            jury_address: "\\b(0{5}0+|1{5}1+)\\b"
            address: "\\b(0{5}0+|1{5}1+)\\b"
            full_address: "\\b(0{5}0+|1{5}1+)\\b"
          replaceWithNone: "нет"
          aliases:
            id: "supplier_id"
        ids: "supplier_id"
        type: "left"
        renameSuffix: "_suppliers"
    entities:
      persons:
        columns:
          firstname: "fname"
          lastname: "lname"
          middlename: "mname"
      phones:
        columns:
          phones: "phone"
      emails:
        columns:
          email: "email"
      accounts:
        columns:
          login: "login"
          password: "password"
      works:
        columns:
          position: "position"
          company_prefix: "opf_suppliers"
          company_title: "name_suppliers"
          company_alias: "alias_suppliers"
          company_inn: "inn_suppliers"
          official_address: "jury_address_suppliers"
          address: "address_suppliers"
          additional_address: "full_address_suppliers"
          # ignored field
          banking_details: "banking_details_suppliers"
          banking_ogrn: "banking_add_suppliers"
          company_url: "url_suppliers"
      actuality:
        columns:
          actuality: "date_lastrequest"
  - id: "stuff"
    read:
      path: "staff.csv"
      options:
        multiline: "true"
      trimValues: " \"'/_-"
      replaceWithNone: "нет"
      replaceRegexWithNone: "^(\\s|\\-|\\*|;|,|\\.|=|/|\\+|\")*$"
      replaceRegexPatrial:
        last_login: " 00:00:00$"
        birthday: "^0$"
        birthmonth: "^0$"
        birthyear: "^0$"
      aliases:
        id: "staff_id"
      append:
        - read:
            path: "staff_addresses.csv"
            trimValues: " \"'/_-"
            replaceWithNone: "нет"
            aliases:
              id_staff: "staff_id"
            filter:
              fn: "and"
              columns:
                - fn: "isNotNull"
                  column: "id"
                - fn: "isNotNull"
                  column: "code_operator"
                - fn: "isNotNull"
                  column: "phone"
          ids: "staff_id"
          type: "left"
          renameSuffix: "_staff_addresses"
        - read:
            path: "clients.csv"
            options:
              multiline: "true"
            trimValues: " \"'/_-"
            replaceRegexPatrial:
              jur_address: "\\b(0{5}0+|1{5}1+)\\b"
              address: "\\b(0{5}0+|1{5}1+)\\b"
              post_index: "\\b(0{5}0+|1{5}1+)\\b"
              post_address: "\\b(0{5}0+|1{5}1+)\\b"
            replaceWithNone: "нет"
            replaceRegexWithNone: "^(\\s|\\-|\\*|;|,|\\.|=|/|\\+|\")*$"
            aliases:
              id: "client_id"
          ids: "client_id"
          type: "left"
          renameSuffix: "_staff_companies"
        - read:
            path: "transactions_FULL.csv"
            options:
              multiline: "true"
            trimValues: " \"'/_-"
            replaceWithNone: "нет"
            replaceRegexWithNone: "^(\\s|\\-|\\*|;|,|\\.|=|/|\\+|\")*$"
            append:
              read:
                path: "transactions_with_owners.csv"
                options:
                  multiline: "true"
                trimValues: " \"'/_-"
                replaceWithNone: "нет"
                replaceRegexWithNone: "^(\\s|\\-|\\*|;|,|\\.|=|/|\\+|\")*$"
              ids: [ "staff_id", "pan", "bank_name" ]
              type: "full"
              renameSuffix: "_staff_transactions_owners"
          ids: "staff_id"
          type: "left"
          renameSuffix: "_staff_transactions"
    entities:
      persons:
        columns:
          firstname: "fname"
          lastname: "lname"
          middlename: "mname"
          birthday: "birthday"
          birthmonth: "birthmonth"
          birthyear: "birthyear"
      phones:
        columns:
          phone_code_1: "town_code"
          phone_1: "phone"
          phone_code_2: "code_operator_staff_addresses"
          phone_2: "phone_staff_addresses"
      emails:
        columns:
          email: "email"
      accounts:
        columns:
          login: "login"
          password: "password"
      works:
        columns:
          position: "position"
          company_official_prefix: "jur_opf_staff_companies"
          company_official_title: "jur_name_staff_companies"
          company_prefix: "opf_staff_companies"
          company_alias: "name_staff_companies"
          company_title: "official_name_staff_companies"
          company_inn: "inn_staff_companies"
          official_address: "jur_address_staff_companies"
          address: "address_staff_companies"
          additional_address_index: "post_index_staff_companies"
          additional_address: "post_address_staff_companies"
          company_url: "url_staff_companies"
      raw_metadata:
        columns:
          department: "department"
          pan: "pan_staff_transactions"
          bank_name: "bank_name_staff_transactions"
      actuality:
        columns:
          date_reg: "date_reg"
          date_lastrequest: "date_lastrequest"
          last_login: "last_login"
