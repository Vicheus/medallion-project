silver:
  - id: "admins"
    entities:
      persons:
        columns:
          names:
            source:
              fn: "name_udf"
              column: "name"
            filter: true
      emails:
        columns:
          emails:
            source:
              fn: "email_udf"
              column: "email"
            filter: true
      accounts:
        columns:
          accounts:
            source:
              fn: "case"
              condition:
                fn: "and"
                columns:
                  - fn: "isNotNull"
                    column: "login"
                  - fn: "isNotNull"
                    column: "password"
              value:
                fn: "struct"
                values:
                  title:
                    lit: "Доставка обедов Obed.ru"
                  link:
                    lit: "https://www.obed.ru"
                  login: "login"
                  password_hash: "password"
            filter: true
      raw_metadata:
        columns:
          raw_metadata:
            source:
              fn: "raw_metadata_udf"
              values:
                departments: "departments"
            filter: true
      actuality:
        columns:
          actuality:
            source:
              fn: "actuality_date_udf"
              column: "actuality"
            filter: true
  - id: "managers"
    entities:
      persons:
        columns:
          __lastname:
            source:
              fn: "regexp_replace"
              column: "lastname"
              pattern:
                lit: "\\d"
          __firstname:
            source:
              fn: "regexp_replace"
              column: "firstname"
              pattern:
                lit: "\\d"
          __middlename:
            source:
              fn: "regexp_replace"
              column: "middlename"
              pattern:
                lit: "\\d"
          names:
            source:
              fn: "name_parts_ordered_udf"
              columns:
                - "__lastname"
                - fn: "case"
                  condition:
                    fn: "ne"
                    column: "__firstname"
                    value: "__lastname"
                  value: "__firstname"
                - "__middlename"
            filter: true
      phones:
        columns:
          phones:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "phones_udf"
                  column:
                    fn: "split"
                    column: "phones"
                    pattern:
                      lit: ",|;|\\bили\\b"
            filter: true
      emails:
        columns:
          emails:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "emails_udf"
                  column:
                    fn: "split"
                    column: "email"
                    pattern:
                      lit: ",|;|\\bили\\b"
            filter: true
      accounts:
        columns:
          accounts:
            source:
              fn: "case"
              condition:
                fn: "and"
                columns:
                  - fn: "isNotNull"
                    column: "login"
                  - fn: "isNotNull"
                    column: "password"
              value:
                fn: "struct"
                values:
                  title:
                    lit: "Доставка обедов Obed.ru"
                  link:
                    lit: "https://www.obed.ru"
                  login: "login"
                  password: "password"
            filter: true
      address:
        entities:
          - "works"
          - "persons"
        columns:
          __company:
            source:
              fn: "coalesce"
              columns:
                - fn: "concat_ws"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "not"
                        column:
                          fn: "startswith"
                          column:
                            fn: "lower"
                            column: "company_title"
                          value:
                            fn: "concat"
                            columns:
                              - fn: "lower"
                                column: "company_prefix"
                              - lit: " "
                      value: "company_prefix"
                    - "company_title"
                - "company_alias"
          __filter_company_titles:
            source:
              fn: "array_distinct"
              column:
                fn: "array_compact"
                column:
                  fn: "array"
                  columns:
                    - "__company"
                    - fn: "base_raw_validation_udf"
                      column: "company_alias"
            filter:
              fn: "and"
              columns:
                - fn: "eq"
                  column:
                    fn: "size"
                    column: "__filter_company_titles"
                  value:
                    lit: 1
                - fn: "eq"
                  column:
                    fn: "lower"
                    column:
                      fn: "try_element_at"
                      column: "__filter_company_titles"
                      value:
                        lit: 1
                  value:
                    fn: "concat_ws"
                    columns:
                      - lit: "частное лицо"
                      - fn: "lower"
                        column:
                          fn: "name_parts_ordered_udf"
                          columns:
                            - "lastname"
                            - fn: "case"
                              condition:
                                fn: "ne"
                                column: "firstname"
                                value: "lastname"
                              value: "firstname"
                            - "middlename"
          address:
            source:
              fn: "explode"
              column:
                fn: "array_distinct"
                column:
                  fn: "array"
                  columns:
                    - fn: "address_udf"
                      column: "official_address"
                    - fn: "address_udf"
                      column: "address"
                    - fn: "address_udf"
                      column: "additional_address"
            filter: true
      works:
        entities:
          - "works"
          - "persons"
        columns:
          __company:
            source:
              fn: "coalesce"
              columns:
                - fn: "concat_ws"
                  columns:
                    - fn: "case"
                      condition:
                        fn: "not"
                        column:
                          fn: "startswith"
                          column:
                            fn: "lower"
                            column: "company_title"
                          value:
                            fn: "concat"
                            columns:
                              - fn: "lower"
                                column: "company_prefix"
                              - lit: " "
                      value: "company_prefix"
                    - "company_title"
                - "company_alias"
          __filter_company_titles:
            source:
              fn: "array_distinct"
              column:
                fn: "array_compact"
                column:
                  fn: "array"
                  columns:
                    - "__company"
                    - fn: "base_raw_validation_udf"
                      column: "company_alias"
            filter:
              fn: "not"
              column:
                fn: "and"
                columns:
                  - fn: "eq"
                    column:
                      fn: "size"
                      column: "__filter_company_titles"
                    value:
                      lit: 1
                  - fn: "eq"
                    column:
                      fn: "lower"
                      column:
                        fn: "try_element_at"
                        column: "__filter_company_titles"
                        value:
                          lit: 1
                    value:
                      fn: "concat_ws"
                      columns:
                        - lit: "частное лицо"
                        - fn: "lower"
                          column:
                            fn: "name_parts_ordered_udf"
                            columns:
                              - "lastname"
                              - fn: "case"
                                condition:
                                  fn: "ne"
                                  column: "firstname"
                                  value: "lastname"
                                value: "firstname"
                              - "middlename"
          __company_official_address:
            source:
              fn: "address_udf"
              column: "official_address"
          __company_address:
            source:
              fn: "address_udf"
              column: "address"
          __company_additional_address:
            source:
              fn: "address_udf"
              column: "additional_address"
          __main_address:
            source:
              fn: "coalesce"
              columns:
                - "__company_official_address"
                - "__company_address"
                - "__company_additional_address"
          __all_additional_addresses:
            source:
              fn: "array_compact"
              column:
                fn: "array_distinct"
                column:
                  fn: "array_remove"
                  column:
                    fn: "array"
                    columns:
                      - "__company_official_address"
                      - "__company_address"
                      - "__company_additional_address"
                  value: "__main_address"
          works:
            source:
              fn: "work_udf"
              post: "position"
              company: "__company"
              company_ru_inn: "company_inn"
              company_ru_ogrn:
                fn: "coalesce"
                columns:
                  - fn: "case"
                    condition:
                      fn: "rlike"
                      column: "banking_ogrn"
                      value:
                        lit: "\\b[Оо][Гг][Рр][Нн] *:? *\\d{13}\\b"
                    value:
                      fn: "regexp_extract"
                      column: "banking_ogrn"
                      pattern:
                        lit: "\\b[Оо][Гг][Рр][Нн] *:? *(\\d{13})\\b"
                      index:
                        lit: 1
                  - fn: "case"
                    condition:
                      fn: "rlike"
                      column: "__company_official_address"
                      value:
                        lit: "\\b[Оо][Гг][Рр][Нн] *:? *\\d{13}\\b"
                    value:
                      fn: "regexp_extract"
                      column: "__company_official_address"
                      pattern:
                        lit: "\\b[Оо][Гг][Рр][Нн] *:? *(\\d{13})\\b"
                      index:
                        lit: 1
                  - fn: "case"
                    condition:
                      fn: "rlike"
                      column: "banking_details"
                      value:
                        lit: "\\b[Оо][Гг][Рр][Нн] *:? *\\d{13}\\b"
                    value:
                      fn: "regexp_extract"
                      column: "banking_details"
                      pattern:
                        lit: "\\b[Оо][Гг][Рр][Нн] *:? *(\\d{13})\\b"
                      index:
                        lit: 1
              company_address: "__main_address"
              comment:
                fn: "concat_ws"
                columns:
                  - fn: "case"
                    condition:
                      fn: "and"
                      columns:
                        - fn: "isNotNull"
                          column: "company_alias"
                        - fn: "isNotNull"
                          column: "company_title"
                        - fn: "ne"
                          column:
                            fn: "lower"
                            column: "company_alias"
                          value:
                            fn: "lower"
                            column: "company_title"
                        - fn: "ne"
                          column:
                            fn: "lower"
                            column: "company_alias"
                          value:
                            fn: "concat_ws"
                            columns:
                              - fn: "lower"
                                column: "company_prefix"
                              - fn: "lower"
                                column: "company_title"
                    value:
                      fn: "concat"
                      columns:
                        - lit: "Другие названия: "
                        - fn: "base_raw_validation_udf"
                          column: "company_alias"
                  - fn: "case"
                    condition:
                      fn: "and"
                      columns:
                        - fn: "isNotNull"
                          column: "__all_additional_addresses"
                        - fn: "gt"
                          column:
                            fn: "size"
                            column: "__all_additional_addresses"
                          value:
                            lit: 0
                    value:
                      fn: "concat"
                      columns:
                        - lit: "Другие адреса: "
                        - fn: "array_join"
                          column: "__all_additional_addresses"
                          delimiter:
                            lit: ", "
                  - fn: "case"
                    condition:
                      fn: "rlike"
                      column: "company_url"
                      value:
                        lit: "(i)[a-z]"
                    value:
                      fn: "concat"
                      columns:
                        - lit: "url: "
                        - fn: "base_raw_validation_udf"
                          column: "company_url"
                sep:
                  lit: "; "
            filter: true
      actuality:
        columns:
          actuality:
            source:
              fn: "actuality_date_udf"
              column:
                fn: "from_unixtime"
                column: "actuality"
                date_format:
                  lit: "yyyy-MM-dd"
              date_format:
                lit: "%Y-%m-%d"
            filter: true
