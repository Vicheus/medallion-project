sourceId: "index_0670"

bronze:
  read:
    path: "/home/user/Documents/data/index_0670/raw/revitonica_ru_898k_31_05_2024.csv"
    options:
      inferSchema: false
      sep: "|"
  entities:
    persons:
      columns:
        name: "name"
        birth_date: "birth_date"
    address:
      columns:
        city: "city"
    phones:
      columns:
        phone: "phone"
    emails:
      columns:
        email: "email"
    ips:
      columns:
        ip_address: "ip"
silver:
  entities:
    persons:
      columns:
        names:
          source:
            fn: "name_udf"
            column: "name"
          filter: true
        birth_date:
          source:
            fn: "birth_date_udf"
            column: "birth_date"
            date_format:
              lit: "%d.%m.%Y"
    phones:
      columns:
        phones:
          source:
              fn: "phone_udf"
              column: "phone"
    emails:
      columns:
        emails:
          source:
              fn: "email_udf"
              column: "email"
    address:
      columns:
        address:
          source:
            fn: "explode"
            column:
              fn: "array_distinct"
              column:
                fn: "array"
                columns:
                  - fn: "address_udf"
                    column: "city"
          filter: true
    ips:
      columns:
        ips:
          source:
            fn: "ip_udf"
            ip: "ip_address"
          filter: true
gold:
  remain: [ "phones", "emails" ]
  transformations:
    op: "groupBy"
    columns:
        - "names"
        - "phones"
        - "birth_date"
    positive: 
        fn: isNotNull
        column: "phones"
  